<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气系统测试页面</title>
    <script src="weather-system.js"></script>
    <script src="weather-client.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0080FF;
            color: white;
            transition: background-color 2s ease;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #1976D2;
        }
        
        .btn.danger {
            background: #f44336;
        }
        
        .btn.danger:hover {
            background: #d32f2f;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .info-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
        }
        
        .info-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 3px;
        }
        
        .log {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ 天气系统测试页面</h1>
        
        <div class="status">
            <h3>📊 当前状态</h3>
            <div id="currentStatus">正在加载...</div>
        </div>
        
        <div class="test-buttons">
            <button class="btn" onclick="refreshPage()">🔄 刷新页面</button>
            <button class="btn" onclick="testWeather()">🧪 手动测试天气</button>
            <button class="btn" onclick="showWeatherInfo()">📋 显示天气信息</button>
            <button class="btn" onclick="clearWeatherData()">🗑️ 清除天气数据</button>
            <button class="btn danger" onclick="simulateNewDay()">📅 模拟新的一天</button>
        </div>
        
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">当前时间</div>
                <div class="info-value" id="currentTime">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">当前天气</div>
                <div class="info-value" id="currentWeather">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">天气颜色</div>
                <div class="info-value" id="weatherColor">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">最后更新日期</div>
                <div class="info-value" id="lastUpdateDate">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">是否今天已更新</div>
                <div class="info-value" id="todayUpdated">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">距离下次更新</div>
                <div class="info-value" id="nextUpdate">-</div>
            </div>
        </div>
        
        <div class="log" id="log">
            <div>📝 操作日志：</div>
        </div>
    </div>
    
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus() {
            const now = new Date();
            const currentDate = now.toDateString();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            
            // 更新当前时间
            document.getElementById('currentTime').textContent = 
                `${currentHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')} (${currentDate})`;
            
            // 获取天气信息
            const storedWeather = localStorage.getItem('globalWeatherData');
            const lastUpdateDate = localStorage.getItem('weatherUpdatedToday');
            
            if (storedWeather) {
                try {
                    const weatherData = JSON.parse(storedWeather);
                    document.getElementById('currentWeather').textContent = weatherData.name;
                    document.getElementById('weatherColor').textContent = weatherData.baseColor;
                } catch (error) {
                    document.getElementById('currentWeather').textContent = '解析错误';
                    document.getElementById('weatherColor').textContent = '解析错误';
                }
            } else {
                document.getElementById('currentWeather').textContent = '无数据';
                document.getElementById('weatherColor').textContent = '无数据';
            }
            
            document.getElementById('lastUpdateDate').textContent = lastUpdateDate || '无';
            document.getElementById('todayUpdated').textContent = lastUpdateDate === currentDate ? '是' : '否';
            
            // 计算距离下次更新的时间
            if (currentHour < 6) {
                const hoursLeft = 6 - currentHour;
                const minutesLeft = 60 - currentMinute;
                document.getElementById('nextUpdate').textContent = `${hoursLeft-1}小时${minutesLeft}分钟`;
            } else if (lastUpdateDate === currentDate) {
                document.getElementById('nextUpdate').textContent = '明天6点';
            } else {
                document.getElementById('nextUpdate').textContent = '今天6点';
            }
            
            // 更新状态信息
            let statusText = `当前时间: ${currentHour}:${currentMinute.toString().padStart(2, '0')}<br>`;
            statusText += `当前日期: ${currentDate}<br>`;
            statusText += `今天是否已更新: ${lastUpdateDate === currentDate ? '是' : '否'}<br>`;
            statusText += `天气系统状态: ${window.globalWeatherSystem ? '已加载' : '未加载'}`;
            
            document.getElementById('currentStatus').innerHTML = statusText;
        }
        
        function refreshPage() {
            log('🔄 刷新页面...');
            window.location.reload();
        }
        
        function testWeather() {
            log('🧪 手动测试天气更新...');
            if (window.testWeather) {
                window.testWeather();
                setTimeout(() => {
                    updateStatus();
                    log('✅ 天气测试完成');
                }, 1000);
            } else {
                log('❌ 天气系统未加载');
            }
        }
        
        function showWeatherInfo() {
            log('📋 显示天气信息...');
            if (window.globalWeatherSystem) {
                const weather = window.globalWeatherSystem.getWeather();
                log(`当前天气: ${weather ? weather.name : '无'}`);
                log(`天气颜色: ${weather ? weather.baseColor : '无'}`);
                log(`最后更新: ${weather ? new Date(weather.timestamp).toLocaleString() : '无'}`);
            } else {
                log('❌ 天气系统未加载');
            }
        }
        
        function clearWeatherData() {
            log('🗑️ 清除天气数据...');
            localStorage.removeItem('globalWeatherData');
            localStorage.removeItem('weatherUpdatedToday');
            updateStatus();
            log('✅ 天气数据已清除');
        }
        
        function simulateNewDay() {
            log('📅 模拟新的一天...');
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            localStorage.setItem('weatherUpdatedToday', yesterday.toDateString());
            updateStatus();
            log('✅ 已设置为昨天更新，下次检查时会触发天气更新');
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 页面已加载');
            updateStatus();
            
            // 每秒更新状态
            setInterval(updateStatus, 1000);
            
            log('✅ 天气系统测试页面已就绪');
        });
    </script>
</body>
</html>
